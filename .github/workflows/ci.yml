name: Test, build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prada-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      SITE_ADDRESS: ":80"
      CORS_ORIGINS: '["http://localhost:8080"]'
      PRADA_IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        run: |
          python -m pip install uv==0.12.19
          uv sync --project backend --locked --python 3.12
      - name: Backend tests
        run: uv run --directory backend --locked pytest
      - name: Image names
        shell: bash
        run: |
          echo "PRADA_IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PRADA_SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      - name: Validate Compose and build both images
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example build --pull
      - name: Start containers and test HTTP and WebSockets
        run: |
          docker compose --env-file .env.example up -d --no-build --wait --wait-timeout 120
          uv run --project backend --locked python infra/smoke.py http://localhost:8080
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --tail=100
      - name: Publish tested images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker compose --env-file .env.example push
          for service in api web; do
            docker tag "$PRADA_IMAGE_PREFIX-$service:$PRADA_IMAGE_TAG" "$PRADA_IMAGE_PREFIX-$service:latest"
            docker push "$PRADA_IMAGE_PREFIX-$service:latest"
          done
          printf 'Published API and web images.\n\n`PRADA_IMAGE_PREFIX=%s`\n\n`PRADA_IMAGE_TAG=%s`\n' "$PRADA_IMAGE_PREFIX" "$PRADA_IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop test containers
        if: always()
        run: docker compose --env-file .env.example down --volumes
